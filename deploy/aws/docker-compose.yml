name: octopus-store

services:
  qdrant:
    image: qdrant/qdrant:v1.19.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    ports:
      - "127.0.0.1:5672:5672"
    environment:
      RABBITMQ_DEFAULT_USER: form
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?set_in_environment_file}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  qdrant_data:
  rabbitmq_data:
